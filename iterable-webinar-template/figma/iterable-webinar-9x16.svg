<?xml version="1.0" encoding="UTF-8"?>
<!--
  Iterable Webinar Template - 9:16 (1080x1920) - DERIVED, NOT YET DESIGNED

  This is a starting point, not approved work. Element sizes are carried over
  unchanged from the 4:5 and the stack is re-centred for the taller canvas.
  Nobody has designed how this layout should actually adapt to 9:16 - that is
  the job this file exists to hand to the design team.

  Why it exists: a 4:5 video posted to Instagram becomes a Reel and is
  letterboxed into a 1080x1920 player. A native 9:16 cut sidesteps that
  entirely. Guides here are the Reels UI zones at native scale.

  Text is real <text>, not outlined - keep it that way so Figma imports
  editable text layers.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1080" height="1920" viewBox="0 0 1080 1920">

  <defs>
    <radialGradient id="bg-gradient-916" cx="50%" cy="0%" r="120%">
      <stop offset="0%"   stop-color="#23263A"/>
      <stop offset="62%"  stop-color="#15161A"/>
    </radialGradient>
  </defs>

  <g id="BACKGROUND-plate">
    <rect x="0" y="0" width="1080" height="1920" fill="url(#bg-gradient-916)"/>
  </g>

  <g id="LOGO-replace-source">
    <rect x="420" y="390" width="240" height="70" rx="4" fill="#3A3550"/>
    <text x="540" y="432" fill="#C9C4EC" font-family="Sofia Pro" font-weight="500"
          font-size="18" text-anchor="middle" letter-spacing="1.5">LOGO</text>
  </g>

  <g id="SPEAKER-WINDOW-replace-with-footage">
    <rect x="108" y="550" width="864" height="486" rx="20" fill="#2E313D"/>
    <text x="540" y="787" fill="#8B8FA8" font-family="Sofia Pro" font-weight="500"
          font-size="26" text-anchor="middle" letter-spacing="1.2">16:9 SPEAKER WINDOW</text>
    <text x="540" y="825" fill="#6E7288" font-family="Sofia Pro" font-weight="500"
          font-size="20" text-anchor="middle">drop footage here — 20px radius</text>
  </g>

  <g id="SPEAKER-ID">
    <text id="SPEAKER-name" x="540" y="1128" fill="#FFFFFF"
          font-family="Sofia Pro" font-weight="700" font-size="42"
          text-anchor="middle">Jamie Alvarez</text>
    <text id="SPEAKER-title-and-company" x="540" y="1172" fill="#C2C4DB"
          font-family="Sofia Pro" font-weight="500" font-size="38"
          text-anchor="middle">VP Lifecycle Marketing, Iterable</text>
  </g>

  <g id="CAPTIONS">
    <rect id="CAPTION-background-chip" x="120" y="1210" width="840" height="170"
          rx="8" fill="#000000" fill-opacity="0.55"/>
    <text id="CAPTION-line-1" x="540" y="1275" fill="#FFFFFF"
          font-family="Sofia Pro" font-weight="500" font-size="58"
          text-anchor="middle">&#8220;the results we saw after</text>
    <text id="CAPTION-line-2" x="540" y="1342" fill="#FFFFFF"
          font-family="Sofia Pro" font-weight="500" font-size="58"
          text-anchor="middle">rolling this out were wild.&#8221;</text>
  </g>

  <g id="TITLE-session-name">
    <text x="540" y="1469" fill="#E8E6F5"
          font-family="Sofia Pro" font-weight="500" font-size="40"
          text-anchor="middle">Scaling Lifecycle Messaging &#8212; Ep. 4</text>
  </g>

  <!-- Instagram Reels UI zones at native 9:16 scale. -->
  <g id="GUIDES" fill="none" stroke-dasharray="12 8" stroke-width="3">
    <rect id="GUIDE-reels-top" x="0" y="0" width="1080" height="108" stroke="#66CCFF"/>
    <rect id="GUIDE-reels-bottom-caption-audio" x="0" y="1600" width="1080" height="320" stroke="#66CCFF"/>
    <rect id="GUIDE-reels-action-rail" x="960" y="1100" width="120" height="500" stroke="#66CCFF"/>
    <rect id="GUIDE-reels-left-margin" x="0" y="0" width="60" height="1920" stroke="#66CCFF"/>
  </g>

</svg>
